; ESP32-C3 SuperMini + 2.13" e-paper (Waveshare V4 / SSD1680)
;
; The SuperMini is pin-compatible enough with the DevKitM-1 definition;
; what matters is the C3 target, 4 MB flash and native USB CDC.

[env:esp32-c3-supermini]
platform      = espressif32@^6.5.0
board         = esp32-c3-devkitm-1
framework     = arduino
monitor_speed = 115200

; Native USB-C on the C3 is USB Serial/JTAG. ARDUINO_USB_CDC_ON_BOOT=1 makes
; `Serial` come out of that port instead of UART0 (GPIO20/21), so the serial
; line protocol works over the same cable you flash with.
; Stamps the binary with a build id so a device can say what it is running.
extra_scripts = pre:scripts/build_id.py
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=1

board_upload.flash_size = 4MB
board_build.partitions  = default.csv

lib_deps =
    zinggjm/GxEPD2@^1.5.8
    adafruit/Adafruit GFX Library@^1.11.9
    ricmoo/QRCode@^0.0.1

; The C3's native USB enumerates as a CDC-ACM device. Without this, PlatformIO
; auto-detects the motherboard's legacy /dev/ttyS0 and fails with an I/O error.
upload_port  = /dev/ttyACM*
monitor_port = /dev/ttyACM*

; The C3's USB-JTAG port resets cleanly without DTR/RTS toggling.
monitor_dtr = 0
monitor_rts = 0
